services:
  - type: web
    name: yt2mp3-bot
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Значение задаётся вручную в панели Render, в репозиторий не попадает.
      - key: BOT_TOKEN
        sync: false
      # PO-токены включены по умолчанию — сервер поднимается сам в контейнере.
      # Только если YouTube всё равно блокирует, можно дополнительно задать
      # COOKIES_FILE, см. README (закомментировано ниже).
      # - key: COOKIES_FILE
      #   value: /etc/secrets/cookies.txt
